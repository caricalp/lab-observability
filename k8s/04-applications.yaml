apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-flask
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-flask
  template:
    metadata:
      labels:
        app: api-flask
    spec:
      containers:
        - name: api-flask
          image: local/api-flask:latest
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: "postgresql.database.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "zabbix"
            - name: DB_USER
              value: "zabbix"
            - name: DB_PASS
              value: "zabbix_pwd"
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api-flask
  namespace: applications
spec:
  type: NodePort
  selector:
    app: api-flask
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-coleta
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-coleta
  template:
    metadata:
      labels:
        app: api-coleta
    spec:
      containers:
        - name: akamai-exporter
          image: local/akamai-exporter:latest
          imagePullPolicy: Never
          env:
            - name: MOCK_URL
              value: "http://mock-akamai.simulations.svc.cluster.local:8080"
            - name: CLIENT_TOKEN
              value: "akab-client-token-xxx"
            - name: CLIENT_SECRET
              value: "akab-client-secret-xxx"
            - name: ACCESS_TOKEN
              value: "akab-access-token-xxx"
            - name: PORT
              value: "9110"
            - name: SCRAPE_INTERVAL
              value: "30"
          ports:
            - containerPort: 9110
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api-coleta
  namespace: applications
spec:
  type: NodePort
  selector:
    app: api-coleta
  ports:
    - port: 9110
      targetPort: 9110
      nodePort: 30911

