apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-alloy
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    // ========================================================================
    // Grafana Alloy - Cluster K3s -> Grafana Cloud (caiqueferreira)
    // ========================================================================

    // ------------------------------------------------------------------------
    // 1. EXPORTADORES CLOUD (Prometheus, Loki, Tempo)
    // ------------------------------------------------------------------------
    prometheus.remote_write "cloud" {
      endpoint {
        url = "https://prometheus-prod-40-prod-sa-east-1.grafana.net/api/prom/push"
        basic_auth {
          username = "<GRAFANA_CLOUD_USER_ID>"
          password = "<GRAFANA_CLOUD_API_TOKEN>"
        }
      }
    }

    loki.write "cloud" {
      endpoint {
        url = "https://logs-prod-024.grafana.net/loki/api/v1/push"
        basic_auth {
          username = "<GRAFANA_CLOUD_USER_ID>"
          password = "<GRAFANA_CLOUD_API_TOKEN>"
        }
      }
    }

    otelcol.exporter.otlphttp "tempo_cloud" {
      client {
        endpoint = "https://tempo-prod-17-prod-sa-east-1.grafana.net/tempo"
        auth     = otelcol.auth.basic.tempo.handler
      }
    }

    otelcol.auth.basic "tempo" {
      username = "<GRAFANA_CLOUD_USER_ID>"
      password = "<GRAFANA_CLOUD_API_TOKEN>"
    }

    // ------------------------------------------------------------------------
    // 2. SCRAPES DE METRICAS KUBERNETES
    // ------------------------------------------------------------------------
    // Aplicações (api-flask)
    prometheus.scrape "api_flask" {
      targets = [
        {
          "__address__" = "api-flask.applications.svc.cluster.local:5000",
          "job"         = "api-flask",
          "namespace"   = "applications",
          "env"         = "k3s-lab",
        },
      ]
      forward_to      = [prometheus.remote_write.cloud.receiver]
      scrape_interval = "15s"
    }

    // Exporter Akamai (api-coleta)
    prometheus.scrape "api_coleta" {
      targets = [
        {
          "__address__" = "api-coleta.applications.svc.cluster.local:9110",
          "job"         = "akamai-exporter",
          "namespace"   = "applications",
          "env"         = "k3s-lab",
        },
      ]
      forward_to      = [prometheus.remote_write.cloud.receiver]
      scrape_interval = "15s"
    }

    // Exporter M365 (api-coleta-m365)
    prometheus.scrape "api_coleta_m365" {
      targets = [
        {
          "__address__" = "api-coleta-m365.applications.svc.cluster.local:9115",
          "job"         = "m365-exporter",
          "namespace"   = "applications",
          "env"         = "k3s-lab",
        },
      ]
      forward_to      = [prometheus.remote_write.cloud.receiver]
      scrape_interval = "15s"
    }

    // Prometheus Local (Monitoring)
    prometheus.scrape "k3s_prometheus" {
      targets = [
        {
          "__address__" = "prometheus.monitoring.svc.cluster.local:9090",
          "job"         = "prometheus",
          "namespace"   = "monitoring",
          "env"         = "k3s-lab",
        },
      ]
      forward_to      = [prometheus.remote_write.cloud.receiver]
      scrape_interval = "30s"
    }

    // ------------------------------------------------------------------------
    // 3. LOGS DE TODOS OS PODS DO KUBERNETES -> LOKI CLOUD
    // ------------------------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "k8s_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.k8s_pods.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.write.cloud.receiver]
    }

    // ------------------------------------------------------------------------
    // 4. RECEIVER OTLP (Traces -> Tempo Cloud)
    // ------------------------------------------------------------------------
    otelcol.receiver.otlp "default" {
      http {
        endpoint = "0.0.0.0:4318"
      }
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      output {
        traces = [otelcol.exporter.otlphttp.tempo_cloud.input]
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: observability
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      containers:
        - name: alloy
          image: grafana/alloy:latest
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12345
              name: http-metrics
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-alloy
  namespace: observability
spec:
  type: NodePort
  selector:
    app: grafana-alloy
  ports:
    - port: 12345
      targetPort: 12345
      nodePort: 31234
      name: http-metrics
    - port: 4317
      targetPort: 4317
      nodePort: 30317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      nodePort: 30318
      name: otlp-http
