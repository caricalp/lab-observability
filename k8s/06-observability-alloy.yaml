apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-alloy
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    // ========================================================================
    // Grafana Alloy - Cluster K3s -> Grafana Cloud (caiqueferreira)
    // Pipeline: OTLP Gateway (Métricas, Logs, Traces) + Loki Cloud
    // ========================================================================

    // ------------------------------------------------------------------------
    // 1. EXPORTADORES CLOUD (Loki & OTLP Gateway)
    // ------------------------------------------------------------------------
    loki.write "cloud" {
      endpoint {
        url = "https://logs-prod-024.grafana.net/loki/api/v1/push"
        basic_auth {
          username = "<GRAFANA_CLOUD_USER_ID>"
          password = "<GRAFANA_CLOUD_API_TOKEN>"
        }
      }
    }

    // Exportador OTLP Gateway oficial do Grafana Cloud
    otelcol.auth.basic "grafana_cloud_otlp" {
      username = "<GRAFANA_CLOUD_USER_ID>"
      password = "<GRAFANA_CLOUD_API_TOKEN>"
    }

    otelcol.exporter.otlphttp "grafana_cloud_otlp" {
      client {
        endpoint = "https://otlp-gateway-prod-sa-east-1.grafana.net/otlp"
        auth     = otelcol.auth.basic.grafana_cloud_otlp.handler
      }
    }

    // ------------------------------------------------------------------------
    // 2. RECEIVER LOKI PUSH M365 (Office 365 Audit API com Geolocalização)
    // ------------------------------------------------------------------------
    loki.source.api "m365_api" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 9999
      }
      forward_to = [loki.process.m365_teste.receiver]
    }

    loki.process "m365_teste" {
      stage.json {
        expressions = {
          operation     = "Operation",
          workload      = "Workload",
          result        = "ResultStatus",
          creation_time = "CreationTime",
          country       = "Country",
          latitude      = "Latitude",
          longitude     = "Longitude",
        }
      }

      stage.labels {
        values = {
          operation = "",
          workload  = "",
          result    = "",
          country   = "",
        }
      }

      stage.timestamp {
        source   = "creation_time"
        format   = "2006-01-02T15:04:05"
        location = "UTC"
      }

      stage.static_labels {
        values = {
          job      = "m365-audit",
          ambiente = "teste",
          origem   = "m365-mock",
        }
      }

      forward_to = [loki.write.cloud.receiver]
    }

    // ------------------------------------------------------------------------
    // 3. LOGS DE TODOS OS PODS DO KUBERNETES -> LOKI CLOUD
    // ------------------------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "k8s_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.k8s_pods.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.write.cloud.receiver]
    }

    // ------------------------------------------------------------------------
    // 4. RECEIVER OTLP UNIFICADO (Métricas, Traces e Logs -> OTLP Gateway Cloud)
    // ------------------------------------------------------------------------
    otelcol.receiver.otlp "default" {
      http {
        endpoint = "0.0.0.0:4318"
      }
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      output {
        metrics = [otelcol.exporter.otlphttp.grafana_cloud_otlp.input]
        logs    = [otelcol.exporter.otlphttp.grafana_cloud_otlp.input]
        traces  = [otelcol.exporter.otlphttp.grafana_cloud_otlp.input]
      }
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: observability
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      containers:
        - name: alloy
          image: grafana/alloy:latest
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 9999
              name: loki-push
            - containerPort: 12345
              name: http-metrics
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-alloy
  namespace: observability
spec:
  type: NodePort
  selector:
    app: grafana-alloy
  ports:
    - port: 9999
      targetPort: 9999
      name: loki-push
    - port: 12345
      targetPort: 12345
      nodePort: 31234
      name: http-metrics
    - port: 4317
      targetPort: 4317
      nodePort: 30317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      nodePort: 30318
      name: otlp-http
