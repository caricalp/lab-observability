version: '3.8'

networks:
  lab-net:
    driver: bridge

volumes:
  pg_data:
  zabbix_snmp:
  prom_data:
  grafana_data:
  loki_data:
  pgadmin_data:

services:
  # -------------------------------------------------------------------------
  # 1. POSTGRESQL (Base Relacional do Zabbix e da Aplicação)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lab-net
    ports:
      - "5432:5432"

  # -------------------------------------------------------------------------
  # 2. ZABBIX SERVER & WEB (Monitoramento de Infraestrutura)
  # -------------------------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: lab-zabbix-server
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_snmp:/var/lib/zabbix/snmptraps
    networks:
      - lab-net
    ports:
      - "10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: lab-zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    networks:
      - lab-net
    ports:
      - "8080:8080"

  # -------------------------------------------------------------------------
  # 3. PROMETHEUS (TSDB para Métricas de Aplicação)
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - lab-net
    ports:
      - "9090:9090"

  # -------------------------------------------------------------------------
  # 4. LOKI (Ingestão e Agregação de Logs Estruturados)
  # -------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: lab-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - lab-net
    ports:
      - "3100:3100"

  # -------------------------------------------------------------------------
  # 5. GRAFANA OSS COM PLUGIN ZABBIX
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: lab-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=@Carica98
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - lab-net
    ports:
      - "3000:3000"

  # -------------------------------------------------------------------------
  # 6. PGADMIN 4 (Interface Web para Administração do PostgreSQL)
  # -------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - lab-net
    ports:
      - "5050:80"

  # -------------------------------------------------------------------------
  # 7. CUSTOM API (Aplicação Instrumentada)
  # -------------------------------------------------------------------------
  custom-api:
    build:
      context: ./app
    container_name: lab-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - lab-net
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "2"
        loki-max-backoff: "800ms"
        loki-timeout: "1s"
        labels: "job"
        loki-external-labels: "job=custom-api,env=lab"

  # -------------------------------------------------------------------------
  # 8. TRAFFIC GENERATOR (Worker Contínuo de Carga e Spikes)
  # -------------------------------------------------------------------------
  traffic-generator:
    build:
      context: ./traffic-generator
    container_name: lab-traffic-generator
    restart: unless-stopped
    depends_on:
      - custom-api
    networks:
      - lab-net
